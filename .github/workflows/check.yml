name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # env_file entries must exist for compose to load the file, so the
      # templates stand in for the live env files, which are never committed.
      - run: |
          cp core.env.example core.env
          cp ui.env.example ui.env
          docker compose config --quiet

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PSAvoidUsingWriteHost: the script is run by hand and writes status for a person to read.
      # PSReviewUnusedParameter: -Install, -Uninstall and -Status only select a parameter set.
      # The analyzer version is pinned so a new release cannot change the result
      # without a change in this repository.
      - shell: pwsh
        env:
          PSSA_VERSION: 1.25.0
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -eq $env:PSSA_VERSION)) {
              Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION -Scope CurrentUser -Force
          }
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION
          $findings = Invoke-ScriptAnalyzer -Path ./mcp-memory-autostart.ps1 `
              -ExcludeRule PSAvoidUsingWriteHost, PSReviewUnusedParameter
          $findings | Format-Table -AutoSize RuleName, Severity, Line, Message
          if ($findings) { exit 1 }

  # The autostart tests use .cmd stubs and Windows file locks, so they run on
  # Windows. Pester is pinned for the same reason as the analyzer.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        env:
          PESTER_VERSION: 5.7.1
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -eq $env:PESTER_VERSION)) {
              Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
